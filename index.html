<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="한국어 읽기평가의 선별, 해독, 유창성, 사람 검토 흐름을 시험하는 연구용 프로토타입">
  <title>읽기지도 연구용 프로토타입</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2316365d'/%3E%3Cpath d='M16 17h14c5 0 9 4 9 9v24c-2-3-5-5-10-5H16z' fill='%23fff'/%3E%3Cpath d='M48 17H34c-5 0-9 4-9 9v24c2-3 5-5 10-5h13z' fill='%236ed0c5' opacity='.9'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="처음 화면으로">
        <span class="brand-mark" aria-hidden="true">읽</span>
        <span><strong>읽기지도</strong><small>연구용 프로토타입</small></span>
      </a>
      <div class="research-badge">진단용 아님</div>
    </header>

    <main id="app" tabindex="-1"></main>

    <footer>
      <span>모든 점수는 연구용 원자료입니다.</span>
      <button class="text-button" id="reset-data">이 기기의 연구자료 초기화</button>
    </footer>
  </div>

  <template id="home-template">
    <section class="hero-grid">
      <div class="hero-copy">
        <p class="eyebrow">RESEARCH PROTOTYPE 0.3 DEMO</p>
        <h1>짧게 확인하고,<br><span>필요한 읽기검사로.</span></h1>
        <p class="lead">아동부터 성인까지 사용할 수 있는 한국어 읽기평가 흐름을 시험합니다. 지금은 단어 해독과 읽기 유창성 모듈을 중심으로 작동합니다.</p>
        <div class="module-launch">
          <p class="eyebrow">모듈별 검사</p>
          <div class="module-cards">
            <button class="module-card" data-action="new-module" data-module="decoding"><b>단어 해독</b><span>실제단어·비단어 16개를 읽고 녹음 → 해독 결과지</span><em>약 3분</em></button>
            <button class="module-card" data-action="new-module" data-module="fluency"><b>읽기 유창성</b><span>짧은 글 2편을 낭독하고 녹음 → 유창성 결과지</span><em>약 3분</em></button>
          </div>
        </div>
        <div class="hero-actions">
          <button class="secondary" data-action="new-session">전체 흐름 (선별 → 경로)</button>
          <button class="secondary" data-action="open-review">검토할 기록 보기 <span id="review-count">0</span></button>
          <button class="secondary" data-action="open-report">결과지</button>
        </div>
        <div class="hero-actions secondary-actions">
          <button class="text-button" id="load-demo">예시 채점 기록 불러오기</button>
          <label class="text-button file-button">기록 JSON 가져오기<input type="file" id="import-session-home" accept="application/json,.json" hidden></label>
        </div>
        <p class="quiet">검사는 난독증을 진단하지 않습니다. 원음성과 판정 근거를 남기는 연구용 도구입니다.</p>
      </div>
      <div class="route-map" aria-label="검사 진행 구조">
        <div class="map-node active"><b>01</b><span>기초 정보와<br>짧은 선별</span></div>
        <div class="map-line"></div>
        <div class="map-branch four">
          <div class="map-node"><b>A</b><span>글자·소리<br>/해독</span></div>
          <div class="map-node"><b>B</b><span>읽기<br>유창성</span></div>
          <div class="map-node muted"><b>C</b><span>언어 이해<br><em>화면만</em></span></div>
          <div class="map-node muted"><b>D</b><span>글 이해<br><em>화면만</em></span></div>
        </div>
        <div class="map-line"></div>
        <div class="map-node result"><b>03</b><span>읽기 프로파일과<br>근거 기록</span></div>
      </div>
    </section>

    <section class="status-section">
      <div class="section-heading">
        <div><p class="eyebrow">현재 구현 범위</p><h2>작동하는 것과 아직 정하지 않은 것</h2></div>
      </div>
      <div class="status-grid">
        <article class="status-card done"><span class="status-label">작동</span><h3>연습·본검사·재녹음</h3><p>장치 점검 뒤 연습과 본검사를 구분하고, 음성·시간·품질 후보를 저장합니다.</p></article>
        <article class="status-card done"><span class="status-label">작동</span><h3>두 사람의 독립 채점</h3><p>채점 A와 B를 따로 보존하고, 일치·합의·전문가 보류 상태를 구분합니다.</p></article>
        <article class="status-card provisional"><span class="status-label">개발용</span><h3>문항 16개·지문 2개</h3><p>기능 시험용 후보입니다. 난이도·동형성·비단어 충돌은 아직 확정하지 않았습니다.</p></article>
        <article class="status-card blocked"><span class="status-label">제공 안 함</span><h3>진단과 규준점수</h3><p>표준화 자료가 없으므로 난독증 진단, 백분위, 위험군 판정은 하지 않습니다.</p></article>
      </div>
    </section>
  </template>

  <template id="setup-template">
    <section class="workspace narrow">
      <button class="back" data-action="home">← 처음으로</button>
      <div class="stepper" aria-label="검사 단계"><span class="current">정보</span><span>선별</span><span>세부검사</span><span>완료</span></div>
      <p class="eyebrow">새 검사</p>
      <h1 class="workspace-title" id="setup-title">검사 기록을 준비합니다</h1>
      <p class="lead small">이 정보는 진단 기준이 아니라 문항 묶음과 결과 표시를 구분하기 위해 사용합니다.</p>
      <form id="setup-form" class="form-card">
        <label>참여자 코드<span>이름 대신 연구용 코드를 입력하세요.</span><input name="participant" required placeholder="예: P-001" maxlength="30"></label>
        <fieldset><legend>연령 구간</legend><div class="choice-grid">
          <label class="choice"><input type="radio" name="ageBand" value="아동" required><span>아동<small>초등 연령</small></span></label>
          <label class="choice"><input type="radio" name="ageBand" value="청소년"><span>청소년<small>중·고등 연령</small></span></label>
          <label class="choice"><input type="radio" name="ageBand" value="성인"><span>성인<small>만 18세 이상</small></span></label>
        </div></fieldset>
        <p class="notice" id="setup-route-note">검사할 경로는 고르지 않습니다. 다음 단계의 <b>짧은 선별검사</b> 결과로 필요한 세부 경로가 정해지고, 검사자가 확인·수정할 수 있습니다.</p>
        <label class="inline-check" id="random-order-row"><input type="checkbox" name="randomOrder"> 단어 해독 본검사 순서 무작위 (연습은 항상 먼저, 실제 제시 순서는 기록에 저장)</label>
        <button class="primary wide" type="submit">마이크 점검으로 이동</button>
      </form>
    </section>
  </template>

  <template id="mic-template">
    <section class="workspace narrow center">
      <button class="back align-left" data-action="back">← 정보 입력으로</button>
      <div class="stepper" aria-label="검사 단계"><span class="current">정보</span><span>선별</span><span>세부검사</span><span>완료</span></div>
      <div class="mic-orb" id="mic-orb"><span>●</span></div>
      <p class="eyebrow">장치 점검</p><h1 class="workspace-title">마이크를 확인합니다</h1>
      <p class="lead small">조용한 곳에서 “오늘은 책을 읽습니다”라고 말해 보세요.</p>
      <div class="meter" aria-label="마이크 입력 수준"><span id="meter-fill"></span></div>
      <p id="mic-status" class="notice">아래 버튼을 누르면 마이크 권한을 요청합니다.</p>
      <div class="button-row center"><button class="primary" id="check-mic">마이크 확인</button><button class="secondary hidden" id="continue-screening">선별 단계 시작</button></div>
    </section>
  </template>

  <template id="screen-template">
    <section class="assessment-layout">
      <aside class="assessment-side"><div class="stepper vertical"><span>정보</span><span class="current">선별</span><span>세부검사</span><span>완료</span></div>
        <ol id="screen-steps" class="screen-steps"><li data-step="words">1 단어 읽기 (8개)</li><li data-step="sentence">2 문장 읽기</li></ol>
        <div class="side-note"><b>선별의 역할</b><p>진단이 아니라 “어디를 더 자세히 볼지” 정하는 공통 입구입니다(브리핑 v1.2 2장). 기준값은 파일럿 전 임시값입니다.</p></div></aside>
      <div class="assessment-main"><button class="back" data-action="back">← 마이크 점검으로</button><div id="journey" class="journey"></div><div id="screen-stage"></div></div>
    </section>
  </template>

  <template id="route-template">
    <section class="workspace">
      <button class="back" data-action="back">← 선별 다시 하기</button>
      <div class="stepper"><span>정보</span><span class="current">선별</span><span>세부검사</span><span>완료</span></div>
      <p class="eyebrow">검사 경로</p><h1 class="workspace-title">이번 기록에서 실행할 검사입니다</h1>
      <p class="lead small">선별 결과에 따라 추가 확인이 필요한 경로를 추천했습니다. <b>A·B의 핵심 과제(단어 해독, 연결글 낭독)</b>는 실제로 실시·채점하고, 나머지 하위검사는 화면 흐름 미리보기입니다.</p>
      <div id="screen-summary" class="screen-summary"></div>
      <div id="route-summary" class="platform-grid"></div>
      <p class="notice warning"><b>주의:</b> 분기 기준은 검증 전 임시값입니다(규칙 <span id="rule-version"></span>). 경로 카드의 체크를 바꿔 검사자가 조정할 수 있으며, 조정 내역은 기록에 남습니다.</p>
      <button class="primary" id="start-assessment">첫 검사 시작</button> <button class="secondary" id="tour-previews">미리보기 화면만 둘러보기</button>
    </section>
  </template>

  <template id="task-template">
    <section class="task-shell">
      <header class="task-header"><button class="back" id="quit-task">검사 나가기</button><div><b id="task-name">단어 해독</b><span id="task-progress">1 / 4</span></div></header>
      <div id="journey" class="journey"></div>
      <div class="task-stage">
        <div id="practice-banner" class="practice-banner hidden"><b>연습 항목</b><span>녹음 방법을 확인하는 단계이며 점수에 포함되지 않습니다.</span></div>
        <p id="task-instruction" class="task-instruction">화면의 낱말을 소리 내어 읽어주세요.</p>
        <div id="task-tags" class="task-tags" aria-label="항목 정보"></div>
        <div id="stimulus" class="stimulus word">나무</div>
        <div class="record-panel">
          <div class="record-status"><span id="record-dot"></span><b id="record-label">준비됨</b><small id="record-time">00:00</small></div>
          <button class="record-button" id="record-button" aria-label="녹음 시작"><span></span></button>
          <p id="record-help">버튼을 눌러 녹음을 시작하세요.</p>
          <audio id="playback" controls class="hidden"></audio>
        </div>
        <div id="quality-summary" class="quality-summary hidden"></div>
        <div class="button-row center compact"><button class="secondary hidden" id="retry-task">다시 녹음</button><button class="primary hidden" id="next-task">다음 항목</button></div>
      </div>
    </section>
  </template>

  <template id="preview-template">
    <section class="task-shell">
      <header class="task-header"><button class="back" id="preview-exit">나가기</button><div><b id="preview-path">경로</b><span id="preview-progress">1 / 1</span></div></header>
      <div id="journey" class="journey"></div>
      <div class="task-stage">
        <div class="practice-banner preview-banner"><b>UI 미리보기</b><span>이 과제는 플랫폼 흐름을 보여주는 화면이며 채점·저장하지 않습니다. 문항은 예시입니다.</span></div>
        <p class="eyebrow" id="preview-title"></p>
        <p id="preview-instruction" class="task-instruction"></p>
        <div id="preview-stimulus" class="stimulus preview-stimulus"></div>
        <div id="preview-options" class="preview-options"></div>
        <div id="preview-meta" class="preview-meta"></div>
        <div class="button-row center compact"><button class="secondary" id="preview-prev">이전</button><button class="primary" id="preview-next">다음</button></div>
      </div>
    </section>
  </template>

  <template id="report-template">
    <section class="workspace wide-workspace report-page">
      <div class="review-heading no-print"><div><button class="back" data-action="back">← 뒤로</button> <button class="back" data-action="home">처음으로</button><p class="eyebrow">전문 결과지</p><h1 class="workspace-title">결과지</h1></div><div class="report-controls"><select id="report-session-select" aria-label="보고서 기록 선택"></select><select id="report-scope" aria-label="결과지 범위"><option value="all">전체 결과지</option><option value="decoding">단어 해독 결과지</option><option value="fluency">읽기 유창성 결과지</option></select><button class="primary" id="print-report">인쇄 · PDF 저장</button></div></div>
      <div id="report-empty" class="empty hidden"><h2>보고서를 만들 기록이 없습니다</h2><p>검사를 실시하거나 예시 채점 기록을 불러오세요.</p></div>
      <article id="report-content" class="report"></article>
    </section>
  </template>

  <template id="complete-template">
    <section class="workspace narrow center">
      <div class="completion-mark">✓</div><p class="eyebrow">녹음 완료</p><h1 class="workspace-title">검사 기록을 저장했습니다</h1>
      <p class="lead small">녹음을 듣고 채점하면 결과지가 채워집니다. 한 사람만 채점해도 <b>잠정 결과지</b>를 볼 수 있고, 두 번째 채점자가 독립 채점하면 확정됩니다.</p>
      <div class="button-row center"><button class="primary" data-action="open-review">지금 검토하기</button><button class="secondary" data-action="open-report">결과지 보기</button><button class="secondary" data-action="home">처음으로</button></div>
    </section>
  </template>

  <template id="review-template">
    <section class="workspace wide-workspace">
      <div class="review-heading"><div><button class="back" data-action="back">← 뒤로</button> <button class="back" data-action="home">처음으로</button><p class="eyebrow">사람 검토</p><h1 class="workspace-title">녹음과 판정 근거 확인</h1></div><div class="review-controls"><label>검사 기록<select id="session-select" aria-label="검사 기록 선택"></select></label><label>독립 채점 슬롯<select id="rater-slot"><option value="A">채점 A</option><option value="B">채점 B</option></select></label><label>채점자 코드<input id="rater-id" maxlength="24" placeholder="예: R-A"></label><div class="review-control-actions"><button class="secondary" id="run-asr">AI 분석 (기기 안 Whisper)</button><button class="secondary" id="export-session">자료 JSON</button><label class="secondary file-button">가져오기<input type="file" id="import-session" accept="application/json,.json" hidden></label><button class="secondary" id="open-session-result">원점수 보기</button></div></div></div>
      <div id="review-empty" class="empty hidden"><h2>검토할 기록이 없습니다</h2><p>새 검사를 실시하면 녹음 항목이 여기에 표시됩니다.</p><button class="primary" data-action="new-session">새 검사 시작</button></div>
      <p id="asr-status" class="notice hidden"></p>
      <div id="review-content" class="review-layout hidden">
        <aside id="response-list" class="response-list"></aside>
        <article id="review-detail" class="review-detail"></article>
      </div>
    </section>
  </template>

  <template id="result-template">
    <section class="workspace wide-workspace">
      <div class="review-heading"><div><button class="back" data-action="back">← 뒤로</button> <button class="back" data-action="home">처음으로</button><p class="eyebrow">연구용 원점수</p><h1 class="workspace-title">결과와 근거 상태</h1></div><div class="report-controls"><select id="result-session-select" aria-label="결과 기록 선택"></select><button class="primary" id="open-report">전문 결과지 보기</button></div></div>
      <div id="result-empty" class="empty hidden"><h2>표시할 결과가 없습니다</h2><p>검사를 실시하고 두 명의 독립 채점을 완료하면 원점수가 계산됩니다.</p></div>
      <div id="result-content"></div>
    </section>
  </template>

  <script src="scoring.js"></script>
  <script src="catalog.js"></script>
  <script src="report.js"></script>
  <script src="app.js"></script>
</body>
</html>
