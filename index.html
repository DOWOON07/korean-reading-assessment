<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="누구나 디지털로 자신의 읽기 능력을 평가받는 한국어 읽기평가 프로토타입 (선별, 단어 해독, 읽기 유창성, 음성인식 자동 채점)">
  <title>읽기지도 연구용 프로토타입</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2316365d'/%3E%3Cpath d='M16 17h14c5 0 9 4 9 9v24c-2-3-5-5-10-5H16z' fill='%23fff'/%3E%3Cpath d='M48 17H34c-5 0-9 4-9 9v24c2-3 5-5 10-5h13z' fill='%236ed0c5' opacity='.9'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&amp;display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="처음 화면으로">
        <span class="brand-mark" aria-hidden="true">읽</span>
        <span><strong>읽기지도</strong><small>연구용 프로토타입</small></span>
      </a>
      <div class="research-badge"><span data-app-version>연구용 프로토타입 v0.15.0</span> · 표준화 전</div>
    </header>

    <main id="app" tabindex="-1"></main>

    <footer>
      <span>모든 점수는 연구용 원자료입니다.</span>
      <button class="text-button" id="reset-data">이 기기의 연구자료 초기화</button>
    </footer>
  </div>

  <template id="home-template">
    <section class="hero-grid participant-home">
      <div class="hero-copy">
        <p class="eyebrow" data-app-version>연구용 프로토타입 v0.15.0</p>
        <h1>내 읽기 모습을<br><span>알아봅니다.</span></h1>
        <p class="lead">글자와 글을 읽고, 들은 내용의 답을 고릅니다. 잘하는 부분과 더 확인할 부분을 함께 살펴봅니다.</p>
        <div class="hero-actions participant-actions">
          <button class="primary hero-primary" data-action="new-session">읽기 확인 시작</button>
        </div>
        <p class="participant-note">이 도구는 표준화 전 연구판입니다. 병원 진단이나 등급을 정하지 않습니다.</p>
      </div>
      <div class="route-map" aria-label="검사 진행 구조">
        <div class="map-node active"><b>01</b><span>기초 정보와 환경 확인</span></div>
        <div class="map-line"></div>
        <div class="map-node"><b>02</b><span>짧은 선별과 필요한 세부검사</span></div>
        <div class="map-line"></div>
        <div class="map-node result"><b>03</b><span>읽기 수행 기록 확인</span></div>
      </div>
    </section>

    <section class="research-section">
      <details class="research-entry">
        <summary><span><b>검사자·연구자 도구</b><small>경로별 시연, 결과지, 자동 채점 검증</small></span></summary>
        <div class="research-tools">
          <p class="eyebrow">경로별 검사 · 브리핑 v1.2 A~D</p>
          <div class="module-cards four">
            <button class="module-card" data-action="new-module" data-module="decoding"><b>A 글자·소리/해독</b><span>음운인식 · 자모 지식 · 실제·무의미단어</span><em>하위검사 5 · 약 4분</em></button>
            <button class="module-card" data-action="new-module" data-module="fluency"><b>B 읽기 유창성</b><span>핵심: 연결글 낭독 · 선택: 디지털 연구 과제</span><em>핵심 3 · 연구 확장 2</em></button>
            <button class="module-card" data-action="new-module" data-module="language"><b>C 언어 이해</b><span>핵심: 어휘 · 문장 · 듣기 · 선택: 형태소</span><em>핵심 3 · 연구 확장 1</em></button>
            <button class="module-card" data-action="new-module" data-module="comprehension"><b>D 글 이해</b><span>핵심: 사실 · 추론 · 선택: 평가 · 두 글 비교</span><em>핵심 2 · 연구 확장 2</em></button>
          </div>
          <div class="hero-actions researcher-actions">
            <button class="secondary" data-action="open-report">결과지</button>
            <button class="secondary" id="load-demo">예시 결과지</button>
            <button class="secondary" data-action="open-review">자동 채점 검증</button>
            <button class="secondary" data-action="open-tts-lab">TTS 후보 검증</button>
            <label class="secondary file-button">기록 JSON 가져오기<input type="file" id="import-session-home" accept="application/json,.json" hidden></label>
          </div>
          <div class="asr-panel"><span id="asr-state" class="asr-state"></span><button class="text-button" id="preload-asr">음성인식 모델 미리 받기</button></div>
        </div>
      </details>
    </section>
  </template>

  <template id="setup-template">
    <section class="workspace narrow">
      <button class="back" data-action="home">← 처음으로</button>
      <div class="stepper" aria-label="검사 단계"><span class="current">정보</span><span>선별</span><span>세부검사</span><span>완료</span></div>
      <p class="eyebrow">새 검사</p>
      <h1 class="workspace-title" id="setup-title">검사 기록을 준비합니다</h1>
      <p class="lead small">연령 구간은 연구 분석을 위해 기록합니다. 현재 연구판에서는 연령에 따라 글자·문항·점수를 바꾸지 않습니다.</p>
      <form id="setup-form" class="form-card">
        <label>참여자 코드<span>이름 대신 연구용 코드를 입력하세요.</span><input name="participant" required placeholder="예: P-001" maxlength="30"></label>
        <fieldset><legend>연령 구간</legend><div class="choice-grid">
          <label class="choice"><input type="radio" name="ageBand" value="아동" required><span>아동<small>초등 연령</small></span></label>
          <label class="choice"><input type="radio" name="ageBand" value="청소년"><span>청소년<small>중·고등 연령</small></span></label>
          <label class="choice"><input type="radio" name="ageBand" value="성인"><span>성인<small>만 18세 이상</small></span></label>
        </div></fieldset>
        <fieldset><legend>검사 분량</legend><div class="choice-grid two">
          <label class="choice"><input type="radio" name="length" value="demo" checked><span>데모 (짧게)<small>선별 단어 4·문장 1 · 해독 8문항 · 지문 1편</small></span></label>
          <label class="choice"><input type="radio" name="length" value="full"><span>전체<small>선별 단어 8·문장 1 · 해독 16문항 · 지문 2편</small></span></label>
        </div></fieldset>
        <p class="notice" id="setup-route-note">검사할 경로는 고르지 않습니다. 다음 단계의 <b>짧은 선별검사</b> 결과로 필요한 세부 경로가 정해지고, 추천을 확인해 바꿀 수 있습니다.</p>
        <details class="researcher-settings" id="researcher-settings">
          <summary><b>연구자 설정</b><span>참여자에게 설명하지 않아도 되는 실험 조건</span></summary>
          <div class="researcher-settings-body">
            <label class="research-toggle" id="random-order-row"><input type="checkbox" name="randomOrder"><span><b>본검사 낱말 순서를 참여자마다 섞기</b><small>연습 문항은 먼저 제시하고, 섞인 실제 순서는 기록에 저장합니다.</small></span></label>
            <label class="research-toggle" id="support-experiment-row"><input type="checkbox" name="supportExperiment"><span><b>글 이해 후 도움 방식 비교 활동 실시</b><small>도움 없음·핵심 문장 표시·문장 나누기/듣기를 비교하며 기본 점수에는 합치지 않습니다.</small></span></label>
            <label class="research-toggle" id="digital-reading-extension-row"><input type="checkbox" name="digitalReadingExtension"><span><b>B 디지털 읽기 연구 확장 실시</b><small>ROAR식 350ms 단어·비단어 판단과 TOSREC식 문장 참·거짓입니다. 한국어 규준이 없어 기본 유창성 점수와 분리합니다.</small></span></label>
            <label class="research-toggle" id="morphology-extension-row"><input type="checkbox" name="morphologyExtension"><span><b>C 형태소 인식 심화 과제 실시</b><small>한국어 읽기와의 관련성은 있지만 연령 공통 핵심검사로 확정되지 않아 언어이해 기본 점수와 분리합니다.</small></span></label>
            <label class="research-toggle" id="advanced-comprehension-extension-row"><input type="checkbox" name="advancedComprehensionExtension"><span><b>D 고차 문해 연구 확장 실시</b><small>평가·판단과 복수 글·출처 평가를 선택 실시하며 사실·추론 기본 점수와 분리합니다.</small></span></label>
          </div>
        </details>
        <button class="primary wide" type="submit">검사 환경 확인으로 이동</button>
      </form>
    </section>
  </template>

  <template id="preflight-template">
    <section class="workspace narrow">
      <button class="back" data-action="back">← 정보 입력으로</button>
      <div class="stepper" aria-label="검사 단계"><span class="current">환경</span><span>선별</span><span>세부검사</span><span>완료</span></div>
      <p class="eyebrow">검사 환경 확인</p>
      <h1 class="workspace-title">같은 조건에 가깝게 맞춥니다</h1>
      <p class="lead small">화면마다 글자가 너무 크거나 작아지지 않도록 맞춥니다. 카드는 권장 방법일 뿐, 자나 기본 크기로도 계속할 수 있습니다.</p>
      <div class="preflight-card">
        <fieldset class="calibration-field"><legend>1. 화면 글자 크기 맞추기</legend>
          <p>준비된 물건을 고른 뒤, 아래 막대와 같은 길이가 되도록 조절하세요.</p>
          <div class="calibration-methods" role="radiogroup" aria-label="화면 크기 맞춤 방법">
            <label><input type="radio" name="calibrationMethod" value="card" checked><span><b>카드로 맞추기</b><small>교통카드·학생증 등 같은 크기의 카드</small></span></label>
            <label><input type="radio" name="calibrationMethod" value="ruler"><span><b>자로 맞추기</b><small>10 cm 자</small></span></label>
            <label><input type="radio" name="calibrationMethod" value="default"><span><b>지금 크기 사용</b><small>실물 크기는 보장되지 않음</small></span></label>
          </div>
          <div id="calibration-ruler" class="calibration-ruler" aria-label="화면 크기 기준 폭"><span id="calibration-label">카드 긴 변 85.6 mm</span></div>
          <input id="calibration-size" type="range" min="260" max="420" value="324" aria-label="기준 카드 폭 조절">
          <output id="calibration-output">막대 너비를 조절하세요</output>
          <p id="calibration-note" class="quiet">카드 번호나 개인정보는 사용하지 않습니다. 카드의 바깥 길이만 비교합니다.</p>
        </fieldset>
        <fieldset class="preflight-confirm"><legend>2. 검사 조건 확인</legend>
          <label><input type="checkbox" id="distance-confirm"> 화면에서 약 50 cm 떨어져 앉았습니다.</label>
          <label><input type="checkbox" id="display-confirm"> 브라우저 확대·축소를 바꾸지 않고 이 화면을 유지하겠습니다.</label>
        </fieldset>
        <fieldset class="preflight-observation"><legend>3. 감각 보조 상태 기록</legend>
          <label>시력 상태<select id="vision-status"><option value="normal">교정 없이 화면을 편하게 봄</option><option value="corrected">안경·렌즈로 교정함</option><option value="difficulty">화면 보기에 불편함이 있음</option></select></label>
          <label>소리 장치<select id="audio-output"><option value="speaker">스피커</option><option value="headphones">헤드폰·이어폰</option><option value="hearing-support">보청기·청각 보조기기</option></select></label>
        </fieldset>
        <details class="researcher-settings preflight-technical">
          <summary><b>연구자용 환경 기록</b><span>화면·글꼴·대비·음원 상태</span></summary>
          <div class="researcher-settings-body">
            <div id="preflight-checks" class="preflight-checks" aria-live="polite"></div>
            <p id="asr-state" class="asr-state" aria-live="polite"></p>
            <p class="notice warning" id="tts-readiness"></p>
          </div>
        </details>
        <button class="primary wide" id="preflight-continue" disabled>환경 확인 완료</button>
      </div>
    </section>
  </template>

  <template id="mic-template">
    <section class="workspace narrow center">
      <button class="back align-left" data-action="back">← 정보 입력으로</button>
      <div class="stepper" aria-label="검사 단계"><span class="current">정보</span><span>선별</span><span>세부검사</span><span>완료</span></div>
      <div class="mic-orb" id="mic-orb"><span>●</span></div>
      <p class="eyebrow">장치 점검</p><h1 class="workspace-title">마이크를 확인합니다</h1>
      <p class="lead small">조용한 곳에서 “오늘은 책을 읽습니다”라고 말해 보세요.</p>
      <div class="meter" aria-label="마이크 입력 수준"><span id="meter-fill"></span></div>
      <p id="mic-status" class="notice">아래 버튼을 누르면 마이크 권한을 요청합니다.</p>
      <div class="button-row center"><button class="primary" id="check-mic">마이크 확인</button><button class="secondary hidden" id="continue-screening">선별 단계 시작</button></div>
      <p class="quiet">음성 자동 분석은 검사 중에 실행하지 않습니다. 연구자가 결과 화면에서 따로 시작합니다.</p>
    </section>
  </template>

  <template id="screen-template">
    <section class="assessment-layout">
      <aside class="assessment-side"><div class="stepper vertical"><span>정보</span><span class="current">선별</span><span>세부검사</span><span>완료</span></div>
        <ol id="screen-steps" class="screen-steps"><li data-step="words">1 단어 읽기 (8개)</li><li data-step="sentence">2 문장 읽기</li><li data-step="analyze">3 자동 분석</li></ol>
        <div class="side-note"><b>선별의 역할</b><p>“어디를 더 자세히 볼지” 정하는 공통 입구이며, 위험 판정은 규준이 생긴 뒤 제공합니다(브리핑 v1.2 2장). 읽은 소리는 시스템이 자동 채점합니다. 기준값은 파일럿 전 임시값입니다.</p></div></aside>
      <div class="assessment-main"><button class="back" data-action="back">← 마이크 점검으로</button><div id="journey" class="journey"></div><div id="screen-stage"></div></div>
    </section>
  </template>

  <template id="route-template">
    <section class="workspace">
      <button class="back" data-action="back">← 선별 다시 하기</button>
      <div class="stepper"><span>정보</span><span class="current">선별</span><span>세부검사</span><span>완료</span></div>
      <p class="eyebrow">검사 경로</p><h1 class="workspace-title">이번 기록에서 실행할 검사입니다</h1>
      <p class="lead small">선별 결과에 따라 추가 확인이 필요한 경로를 추천했습니다. <b>A·B의 핵심 과제(단어 해독, 연결글 낭독)</b>는 실제로 실시·채점하고, 나머지 하위검사는 화면 흐름 미리보기입니다.</p>
      <div id="screen-summary" class="screen-summary"></div>
      <div id="route-summary" class="platform-grid"></div>
      <p class="notice warning"><b>주의:</b> 분기 기준은 검증 전 임시값입니다(규칙 <span id="rule-version"></span>). 경로 카드의 체크를 바꿔 조정할 수 있으며, 조정 내역은 기록에 남습니다.</p>
      <button class="primary" id="start-assessment">첫 검사 시작</button> <button class="secondary" id="tour-previews">미리보기 화면만 둘러보기</button>
    </section>
  </template>

  <template id="task-template">
    <section class="task-shell">
      <header class="task-header"><button class="back" id="quit-task">검사 나가기</button><div><b id="task-name">단어 해독</b><span id="task-progress">1 / 4</span></div></header>
      <div id="journey" class="journey"></div>
      <div class="task-stage">
        <div id="practice-banner" class="practice-banner hidden"><b>연습 항목</b><span>녹음 방법을 확인하는 단계이며 점수에 포함되지 않습니다.</span></div>
        <p id="task-instruction" class="task-instruction">화면의 낱말을 소리 내어 읽어주세요.</p>
        <div class="instruction-audio"><button class="secondary compact-button" id="task-instruction-audio" type="button">🔊 안내 듣기</button><button class="text-button" id="task-explanation" type="button">검사자 추가 설명 기록</button><span id="task-voice-status" class="quiet"></span></div>
        <div id="task-tags" class="task-tags researcher-only hidden" aria-label="연구자용 항목 정보"></div>
        <div id="stimulus" class="stimulus word">나무</div>
        <div class="record-panel">
          <div class="record-status"><span id="record-dot"></span><b id="record-label">준비됨</b><small id="record-time">00:00</small></div>
          <button class="record-button" id="record-button" aria-label="녹음 시작"><span></span></button>
          <p id="record-help">버튼을 눌러 녹음을 시작하세요.</p>
          <audio id="playback" controls class="hidden"></audio>
          <label id="playback-boost-row" class="playback-boost hidden"><input id="playback-boost" type="checkbox" checked> 녹음 소리를 조금 크게 듣기</label>
        </div>
        <div id="quality-summary" class="quality-summary hidden"></div>
        <div class="button-row center compact"><button class="secondary hidden" id="retry-task">다시 녹음</button><button class="primary hidden" id="next-task">다음 항목</button></div>
      </div>
    </section>
  </template>

  <template id="choice-template">
    <section class="task-shell">
      <header class="task-header"><button class="back" id="choice-quit">검사 나가기</button><div><b id="choice-title">과제</b><span id="choice-module"></span><span id="choice-progress"></span><span id="choice-timer" class="choice-timer"></span></div></header>
      <div id="journey" class="journey"></div>
      <div class="task-stage choice-stage" id="choice-stage"></div>
    </section>
  </template>

  <template id="scaffold-template">
    <section class="task-shell">
      <header class="task-header"><button class="back" id="scaffold-quit">검사 나가기</button><div><b>추가 읽기 활동</b><span id="scaffold-progress"></span></div></header>
      <div class="task-stage choice-stage scaffold-stage">
        <p class="task-instruction" id="scaffold-instruction"></p>
        <div class="choice-passage" id="scaffold-passage"></div>
        <div class="sound-check hidden" id="scaffold-audio-row"><button class="secondary" id="scaffold-audio" type="button">🔊 나누어 듣기</button><span class="quiet" id="scaffold-audio-status"></span></div>
        <p class="choice-stem" id="scaffold-question"></p>
        <div class="choice-options" id="scaffold-options"></div>
        <p class="quiet">이 활동의 결과는 기본 글 이해 점수와 합치지 않습니다.</p>
      </div>
    </section>
  </template>

  <template id="tts-lab-template">
    <section class="workspace narrow">
      <button class="back" data-action="home">← 처음으로</button>
      <p class="eyebrow">검사자·연구자 도구</p><h1 class="workspace-title">한국어 TTS 후보 검증</h1>
      <p class="lead small">같은 문장으로 한국어 음성을 비교합니다. Microsoft SunHi Neural을 1순위 후보로 두되, 실제 재생 속도와 연구자 청취평가를 모두 통과한 음성만 고정합니다.</p>
      <div class="form-card tts-lab-card">
        <label>음성 후보<select id="tts-voice-select"></select></label>
        <label>엔진 속도 시작값 <output id="tts-rate-output">0.90×</output><input id="tts-rate" type="range" min="0.7" max="1.1" step="0.05" value="0.9"></label>
        <label>공통 평가 문장<textarea id="tts-sample">오늘은 맑은 날입니다. 민수는 도서관에서 재미있는 과학책을 읽었습니다.</textarea></label>
        <div class="button-row"><button class="secondary" id="tts-play">후보 듣기</button><span id="tts-lab-status" class="quiet" aria-live="polite"></span></div>
        <p class="notice"><b>속도 합격 후보:</b> 성인 명료 발화 연구를 바탕으로 우선 220–280 음절/분을 파일럿 범위로 씁니다. 0.90×는 목표가 아니라 시작값이며 실제 SPM으로 판단합니다.</p>
        <div class="tts-ratings">
          <label>자연스러움<select id="tts-naturalness"><option value="">선택</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label>
          <label>명료도<select id="tts-clarity"><option value="">선택</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label>
          <label>속도 적절성<select id="tts-speed-fit"><option value="">선택</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label>
        </div>
        <button class="primary wide" id="tts-save">이 음성을 연구 후보로 고정</button>
        <p class="notice" id="tts-current"></p>
      </div>
    </section>
  </template>

  <template id="preview-template">
    <section class="task-shell">
      <header class="task-header"><button class="back" id="preview-exit">나가기</button><div><b id="preview-path">경로</b><span id="preview-progress">1 / 1</span></div></header>
      <div id="journey" class="journey"></div>
      <div class="task-stage">
        <div class="practice-banner preview-banner"><b>UI 미리보기</b><span>이 과제는 플랫폼 흐름을 보여주는 화면이며 채점·저장하지 않습니다. 문항은 예시입니다.</span></div>
        <p class="eyebrow" id="preview-title"></p>
        <p id="preview-instruction" class="task-instruction"></p>
        <div id="preview-stimulus" class="stimulus preview-stimulus"></div>
        <div id="preview-options" class="preview-options"></div>
        <div id="preview-meta" class="preview-meta"></div>
        <div class="button-row center compact"><button class="secondary" id="preview-prev">이전</button><button class="primary" id="preview-next">다음</button></div>
      </div>
    </section>
  </template>

  <template id="report-template">
    <section class="workspace wide-workspace report-page">
      <div class="review-heading no-print"><div><button class="back" data-action="back">← 뒤로</button> <button class="back" data-action="home">처음으로</button><p class="eyebrow">결과 보기</p><h1 class="workspace-title">읽기 확인 결과</h1></div><div class="report-controls"><select id="report-session-select" aria-label="보고서 기록 선택"></select><div class="audience-switch" role="group" aria-label="결과지 종류"><button id="participant-report-view" class="secondary active" type="button">참여자용 요약</button><button id="research-report-view" class="secondary" type="button">연구자용 상세</button></div><select id="report-scope" class="hidden" aria-label="결과지 범위"><option value="all">전체 결과지</option><option value="decoding">A 글자·소리/해독 결과지</option><option value="fluency">B 읽기 유창성 결과지</option><option value="language">C 언어 이해 결과지</option><option value="comprehension">D 글 이해 결과지</option><option value="phonology">A 중 글자·소리 처리만</option><option value="silent">B 중 단어 자동성·묵독만</option></select><button class="primary" id="print-report">인쇄 · PDF 저장</button></div></div>
      <div id="report-empty" class="empty hidden"><h2>보고서를 만들 기록이 없습니다</h2><p>검사를 실시하거나 예시 채점 기록을 불러오세요.</p></div>
      <article id="report-content" class="report"></article>
    </section>
  </template>

  <template id="complete-template">
    <section class="workspace narrow center">
      <div class="completion-mark">✓</div><p class="eyebrow">검사 완료</p><h1 class="workspace-title" id="complete-title">응답을 안전하게 저장했습니다</h1>
      <p class="lead small" id="complete-status">선택형 문항의 결과는 바로 볼 수 있습니다. 녹음 자동 분석은 연구자가 필요할 때 따로 실행합니다.</p>
      <div class="journey-bar complete-bar"><span id="complete-bar" style="width:100%"></span></div>
      <div class="button-row center"><button class="primary" id="complete-report" data-action="open-report">참여자용 결과 보기</button><button class="secondary" data-action="open-review">연구자 자동 분석</button><button class="secondary" data-action="home">처음으로</button></div>
    </section>
  </template>

  <template id="review-template">
    <section class="workspace wide-workspace">
      <div class="review-heading"><div><button class="back" data-action="back">← 뒤로</button> <button class="back" data-action="home">처음으로</button><p class="eyebrow">연구용 · 자동 채점 검증</p><h1 class="workspace-title">녹음과 자동 채점 근거 확인</h1></div><div class="review-controls"><label>검사 기록<select id="session-select" aria-label="검사 기록 선택"></select></label><label>독립 채점 슬롯<select id="rater-slot"><option value="A">채점 A</option><option value="B">채점 B</option></select></label><label>채점자 코드<input id="rater-id" maxlength="24" placeholder="예: R-A"></label><div class="review-control-actions"><button class="secondary" id="run-asr">AI 분석 (기기 안 Whisper)</button><button class="secondary" id="export-session">자료 JSON</button><label class="secondary file-button">가져오기<input type="file" id="import-session" accept="application/json,.json" hidden></label><button class="secondary" id="open-session-result">원점수 보기</button></div></div></div>
      <div id="review-empty" class="empty hidden"><h2>검토할 기록이 없습니다</h2><p>새 검사를 실시하면 녹음 항목이 여기에 표시됩니다.</p><button class="primary" data-action="new-session">새 검사 시작</button></div>
      <p id="asr-status" class="notice hidden"></p>
      <div id="review-content" class="review-layout hidden">
        <aside id="response-list" class="response-list"></aside>
        <article id="review-detail" class="review-detail"></article>
      </div>
    </section>
  </template>

  <template id="result-template">
    <section class="workspace wide-workspace">
      <div class="review-heading"><div><button class="back" data-action="back">← 뒤로</button> <button class="back" data-action="home">처음으로</button><p class="eyebrow">연구용 원점수</p><h1 class="workspace-title">결과와 근거 상태</h1></div><div class="report-controls"><select id="result-session-select" aria-label="결과 기록 선택"></select><button class="primary" id="open-report">전문 결과지 보기</button></div></div>
      <div id="result-empty" class="empty hidden"><h2>표시할 결과가 없습니다</h2><p>검사를 실시하고 두 명의 독립 채점을 완료하면 원점수가 계산됩니다.</p></div>
      <div id="result-content"></div>
    </section>
  </template>

  <script src="version.js"></script>
  <script src="evidence-engine.js"></script>
  <script src="item-bank.js"></script>
  <script src="tts-assets.js"></script>
  <script src="assessment-spec.js"></script>
  <script src="scoring.js"></script>
  <script src="catalog.js"></script>
  <script src="battery.js"></script>
  <script src="report.js"></script>
  <script src="app.js"></script>
</body>
</html>
