<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#14877e"/></marker><style>text{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;fill:#172133}.t{font-size:15px}.s{font-size:12px;fill:#627087}.n{font-size:16px;font-weight:800;fill:white}.h{font-size:28px;font-weight:800}.b{font-size:16px;font-weight:800}.word{font-size:58px;font-weight:800}.call{font-size:15px;font-weight:700}</style></defs>
  <rect width="1200" height="760" fill="#f7f9fc"/><rect x="42" y="30" width="760" height="690" rx="22" fill="white" stroke="#d9e0e8"/>
  <rect x="42" y="30" width="760" height="70" rx="22" fill="#fff"/><text x="72" y="72" class="b">검사 나가기</text><text x="405" y="62" text-anchor="middle" class="b">단어 자동성</text><text x="405" y="84" text-anchor="middle" class="s">본검사 1 / 8</text>
  <rect x="95" y="125" width="654" height="126" rx="18" fill="#e5f5f2" stroke="#b9d8d5"/><text x="422" y="161" text-anchor="middle" class="s">연습 끝</text><text x="422" y="196" text-anchor="middle" class="h">본검사를 시작합니다</text><text x="422" y="225" text-anchor="middle" class="t">첫 문제는 시작을 누른 뒤에 나타납니다.</text>
  <rect x="322" y="273" width="200" height="54" rx="12" fill="#16365d"/><text x="422" y="306" text-anchor="middle" class="n">본검사 시작</text>
  <line x1="95" y1="365" x2="749" y2="365" stroke="#d9e0e8" stroke-dasharray="7 7"/><text x="95" y="391" class="s">시작 뒤 문항 화면</text>
  <text x="422" y="447" text-anchor="middle" class="t">글자를 보고 알맞은 답을 고르세요.</text><text x="422" y="529" text-anchor="middle" class="word">나무</text>
  <rect x="144" y="576" width="260" height="72" rx="14" fill="white" stroke="#bac7d5"/><text x="274" y="619" text-anchor="middle" class="b">F  낱말입니다</text><rect x="440" y="576" width="260" height="72" rx="14" fill="white" stroke="#bac7d5"/><text x="570" y="619" text-anchor="middle" class="b">J  만든 말입니다</text>
  <text x="422" y="687" text-anchor="middle" class="s">본검사에는 정오 피드백이 나오지 않습니다.</text>
  <g><circle cx="850" cy="112" r="19" fill="#14877e"/><text x="850" y="118" text-anchor="middle" class="n">1</text><text x="886" y="107" class="call">연습과 본검사의 경계를 명시</text><text x="886" y="129" class="call">피드백 규칙을 예측 가능하게 함</text><line x1="832" y1="120" x2="726" y2="176" stroke="#14877e" stroke-width="2" marker-end="url(#a)"/></g>
  <g><circle cx="850" cy="250" r="19" fill="#14877e"/><text x="850" y="256" text-anchor="middle" class="n">2</text><text x="886" y="245" class="call">시작 버튼 뒤에만 첫 자극 표시</text><text x="886" y="267" class="call">화면 전환 중 노출 손실 방지</text><line x1="832" y1="255" x2="522" y2="300" stroke="#14877e" stroke-width="2" marker-end="url(#a)"/></g>
  <g><circle cx="850" cy="397" r="19" fill="#14877e"/><text x="850" y="403" text-anchor="middle" class="n">3</text><text x="886" y="392" class="call">자극은 중앙의 단일 초점</text><text x="886" y="414" class="call">조건명·비음화·비단어는 숨김</text><line x1="832" y1="402" x2="488" y2="500" stroke="#14877e" stroke-width="2" marker-end="url(#a)"/></g>
  <g><circle cx="850" cy="548" r="19" fill="#14877e"/><text x="850" y="554" text-anchor="middle" class="n">4</text><text x="886" y="543" class="call">선택지는 44px 이상, 두 칸 고정</text><text x="886" y="565" class="call">F/J 키의 기본 스크롤을 차단</text><line x1="832" y1="550" x2="696" y2="610" stroke="#14877e" stroke-width="2" marker-end="url(#a)"/></g>
  <g><circle cx="850" cy="670" r="19" fill="#14877e"/><text x="850" y="676" text-anchor="middle" class="n">5</text><text x="886" y="665" class="call">연습만 즉시 피드백</text><text x="886" y="687" class="call">본검사는 조건 오염 방지</text></g>
  <text x="42" y="748" class="s">v0.8 화면 구조 설명도 · A/B/C/D 선택형 과제가 공유하는 화면 규칙</text>
</svg>
