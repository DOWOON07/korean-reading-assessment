<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#14877e"/></marker><style>text{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;fill:#172133}.t{font-size:15px}.s{font-size:12px;fill:#627087}.n{font-size:16px;font-weight:800;fill:white}.h{font-size:28px;font-weight:800}.b{font-size:16px;font-weight:800}.call{font-size:15px;font-weight:700}</style></defs>
  <rect width="1200" height="760" fill="#f7f9fc"/><rect x="42" y="28" width="760" height="700" rx="22" fill="white" stroke="#d9e0e8"/>
  <text x="78" y="74" class="s">환경 확인</text><text x="78" y="116" class="h">같은 조건에 가깝게 맞춥니다</text><text x="78" y="147" class="t">카드는 권장 방법일 뿐, 자나 기본 크기로도 계속할 수 있습니다.</text>
  <rect x="76" y="174" width="690" height="510" rx="18" fill="#fff" stroke="#d9e0e8"/><text x="100" y="212" class="b">1. 화면 글자 크기 맞추기</text>
  <g><rect x="100" y="235" width="196" height="70" rx="11" fill="#e5f5f2" stroke="#14877e"/><circle cx="119" cy="270" r="8" fill="#14877e"/><text x="137" y="263" class="b">카드로 맞추기</text><text x="137" y="284" class="s">교통카드·학생증</text></g>
  <g><rect x="313" y="235" width="196" height="70" rx="11" fill="white" stroke="#d9e0e8"/><circle cx="332" cy="270" r="8" fill="white" stroke="#627087"/><text x="350" y="263" class="b">자로 맞추기</text><text x="350" y="284" class="s">0–10 cm</text></g>
  <g><rect x="526" y="235" width="196" height="70" rx="11" fill="white" stroke="#d9e0e8"/><circle cx="545" cy="270" r="8" fill="white" stroke="#627087"/><text x="563" y="263" class="b">지금 크기 사용</text><text x="563" y="284" class="s">보정 안 됨을 기록</text></g>
  <rect x="187" y="332" width="460" height="48" rx="7" fill="#f7f9fc" stroke="#16365d" stroke-width="2"/><text x="417" y="362" text-anchor="middle" class="b">카드 긴 변 85.6 mm</text><line x1="115" y1="408" x2="690" y2="408" stroke="#16365d" stroke-width="4"/><circle cx="417" cy="408" r="12" fill="#16365d"/>
  <text x="100" y="460" class="b">2. 검사 조건 확인</text><rect x="100" y="478" width="622" height="42" rx="10" fill="#fff" stroke="#d9e0e8"/><rect x="115" y="489" width="20" height="20" rx="3" fill="#14877e"/><path d="M120 499l4 4 7-9" fill="none" stroke="white" stroke-width="2"/><text x="150" y="504" class="t">화면에서 약 50 cm 떨어져 앉았습니다.</text><rect x="100" y="530" width="622" height="42" rx="10" fill="#fff" stroke="#d9e0e8"/><rect x="115" y="541" width="20" height="20" rx="3" fill="#14877e"/><path d="M120 551l4 4 7-9" fill="none" stroke="white" stroke-width="2"/><text x="150" y="556" class="t">브라우저 확대·축소를 유지하겠습니다.</text>
  <rect x="100" y="591" width="622" height="45" rx="10" fill="#fbfcfe" stroke="#d9e0e8"/><text x="122" y="619" class="b">연구자용 환경 기록</text><text x="692" y="619" class="b">＋</text><rect x="100" y="648" width="622" height="48" rx="11" fill="#16365d"/><text x="411" y="679" text-anchor="middle" class="n">환경 확인 완료</text>
  <g><circle cx="850" cy="120" r="19" fill="#14877e"/><text x="850" y="126" text-anchor="middle" class="n">1</text><text x="886" y="115" class="call">신용카드 필수 아님</text><text x="886" y="137" class="call">알려진 실물 길이면 보정 가능</text><line x1="832" y1="126" x2="518" y2="260" stroke="#14877e" stroke-width="2" marker-end="url(#a)"/></g>
  <g><circle cx="850" cy="260" r="19" fill="#14877e"/><text x="850" y="266" text-anchor="middle" class="n">2</text><text x="886" y="255" class="call">보정하지 않아도 진행 가능</text><text x="886" y="277" class="call">대신 물리 크기 미보정을 기록</text><line x1="832" y1="265" x2="704" y2="283" stroke="#14877e" stroke-width="2" marker-end="url(#a)"/></g>
  <g><circle cx="850" cy="420" r="19" fill="#14877e"/><text x="850" y="426" text-anchor="middle" class="n">3</text><text x="886" y="415" class="call">시거리·확대 상태를 고정해</text><text x="886" y="437" class="call">시각 조건 변이를 줄임</text><line x1="832" y1="423" x2="710" y2="500" stroke="#14877e" stroke-width="2" marker-end="url(#a)"/></g>
  <g><circle cx="850" cy="570" r="19" fill="#14877e"/><text x="850" y="576" text-anchor="middle" class="n">4</text><text x="886" y="565" class="call">화면·글꼴·대비·음원은</text><text x="886" y="587" class="call">접힌 연구자 기록으로 이동</text><line x1="832" y1="575" x2="720" y2="610" stroke="#14877e" stroke-width="2" marker-end="url(#a)"/></g>
  <g><circle cx="850" cy="680" r="19" fill="#14877e"/><text x="850" y="686" text-anchor="middle" class="n">5</text><text x="886" y="675" class="call">Whisper 준비는 여기서 실행하지 않음</text></g>
  <text x="42" y="748" class="s">v0.8 화면 구조 설명도</text>
</svg>
