<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#14877e"/></marker><style>text{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;fill:#172133}.t{font-size:15px}.s{font-size:12px;fill:#627087}.n{font-size:16px;font-weight:800;fill:white}.h{font-size:28px;font-weight:800}.b{font-size:16px;font-weight:800}.score{font-size:25px;font-weight:800;fill:#16365d}.call{font-size:15px;font-weight:700}</style></defs>
  <rect width="1200" height="760" fill="#f7f9fc"/><rect x="42" y="30" width="760" height="690" rx="22" fill="white" stroke="#d9e0e8"/>
  <text x="75" y="72" class="s">결과 보기</text><text x="75" y="112" class="h">읽기 확인 결과</text><rect x="492" y="54" width="252" height="46" rx="13" fill="#f4f7fa" stroke="#d9e0e8"/><rect x="497" y="59" width="118" height="36" rx="9" fill="#16365d"/><text x="556" y="82" text-anchor="middle" class="n">참여자용 요약</text><text x="674" y="82" text-anchor="middle" class="s">연구자용 상세</text>
  <line x1="75" y1="136" x2="744" y2="136" stroke="#16365d" stroke-width="3"/><text x="75" y="169" class="b">P-001님의 이번 기록</text><text x="75" y="194" class="s">2026. 10. 6. · 성인 구간</text>
  <rect x="75" y="220" width="669" height="94" rx="14" fill="#e5f5f2"/><rect x="75" y="220" width="5" height="94" fill="#14877e"/><text x="101" y="254" class="b">완료된 결과와 분석을 기다리는 결과가 있습니다.</text><text x="101" y="283" class="t">이번 후보 문항에서 확인된 수행만 설명합니다.</text>
  <text x="75" y="354" class="b">활동별 결과</text><rect x="75" y="375" width="322" height="120" rx="14" fill="white" stroke="#d9e0e8"/><rect x="95" y="393" width="65" height="25" rx="6" fill="#e5f5f2"/><text x="127" y="410" text-anchor="middle" class="s">확인 완료</text><text x="95" y="445" class="b">글자·소리 처리</text><text x="95" y="471" class="s">이번 후보 문항의 정답 수</text><text x="364" y="449" text-anchor="end" class="score">7/8</text>
  <rect x="422" y="375" width="322" height="120" rx="14" fill="#fffaf0" stroke="#e8c974"/><rect x="442" y="393" width="54" height="25" rx="6" fill="#fff5d9"/><text x="469" y="410" text-anchor="middle" class="s">분석 전</text><text x="442" y="445" class="b">낱말 소리 내어 읽기</text><text x="442" y="471" class="s">녹음은 저장되어 있습니다</text><text x="711" y="449" text-anchor="end" class="score">—</text>
  <rect x="75" y="525" width="669" height="116" rx="14" fill="#f4f7fa" stroke="#d9e0e8"/><text x="98" y="558" class="b">이 결과를 어떻게 보면 되나요?</text><text x="98" y="588" class="t">• 숫자는 이번 후보 문항에서 맞힌 개수입니다.</text><text x="98" y="616" class="t">• 또래 비교·백분위·진단은 규준 전이라 제공하지 않습니다.</text><text x="75" y="686" class="s">연구용 원자료 · 의료·교육 진단이나 등급이 아님</text>
  <g><circle cx="850" cy="105" r="19" fill="#14877e"/><text x="850" y="111" text-anchor="middle" class="n">1</text><text x="886" y="100" class="call">참여자용을 기본값으로 표시</text><text x="886" y="122" class="call">기술 사양은 이 화면에서 제외</text><line x1="832" y1="110" x2="618" y2="76" stroke="#14877e" stroke-width="2" marker-end="url(#a)"/></g>
  <g><circle cx="850" cy="255" r="19" fill="#14877e"/><text x="850" y="261" text-anchor="middle" class="n">2</text><text x="886" y="250" class="call">한 문장으로 현재 상태 요약</text><line x1="832" y1="257" x2="740" y2="260" stroke="#14877e" stroke-width="2" marker-end="url(#a)"/></g>
  <g><circle cx="850" cy="405" r="19" fill="#14877e"/><text x="850" y="411" text-anchor="middle" class="n">3</text><text x="886" y="400" class="call">전문용어 대신 활동 이름과</text><text x="886" y="422" class="call">정답 수를 큰 글자로 제시</text><line x1="832" y1="410" x2="742" y2="445" stroke="#14877e" stroke-width="2" marker-end="url(#a)"/></g>
  <g><circle cx="850" cy="550" r="19" fill="#14877e"/><text x="850" y="556" text-anchor="middle" class="n">4</text><text x="886" y="545" class="call">‘분석 전’을 결손이 아닌</text><text x="886" y="567" class="call">처리 상태로 설명</text><line x1="832" y1="550" x2="695" y2="477" stroke="#14877e" stroke-width="2" marker-end="url(#a)"/></g>
  <g><circle cx="850" cy="670" r="19" fill="#14877e"/><text x="850" y="676" text-anchor="middle" class="n">5</text><text x="886" y="665" class="call">규준이 없다는 한계를 쉬운 말로 반복</text></g>
  <text x="42" y="748" class="s">v0.8 화면 구조 설명도</text>
</svg>
